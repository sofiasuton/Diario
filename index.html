<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diario</title>
<meta name="description" content="Espacio de journaling con consignas, escritura libre y buscador.">
<meta name="theme-color" content="#0B0B0C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Diario">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side"></aside>
  <div class="wrap">
    <main id="main">
      <header class="top">
        <div class="t"><h1>Diario</h1><div class="muted cap" id="today"></div></div>
        <label class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <span class="sr">Buscar en el diario</span>
          <input type="search" id="q" placeholder="Buscar… (o #etiqueta)" autocomplete="off">
        </label>
        <button class="iconbtn" data-act="gsync" id="syncbtn" hidden aria-label="Sincronizar con Google Drive"></button>
        <button class="iconbtn" data-act="theme" id="themebtn" aria-label="Cambiar modo claro u oscuro"></button>
        <button class="btn" data-act="new"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Nueva entrada</span></button>
      </header>
      <div id="view"></div>
    </main>
    <aside class="right" id="right"></aside>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Navegación"></nav>
<div id="lock" hidden></div>
<div id="lightbox" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="print"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
